---
# ansible-playbook image-update.yaml -i <ton-inventaire>
#
# Telecharge la version attendue des images declarees par l'inventaire, pose
# leurs tags dans la configuration du routeur, et supprime sur demande les
# images qu'aucun conteneur n'utilise plus.
#
# C'est le SEUL playbook de ce depot qui modifie les IMAGES dans
# `config.boot` (`container-readonly.yaml` y pose des tmpfs et des volumes,
# jamais une image). Les `<service>-deploy.yaml` deploient des fichiers de
# configuration et se contentent de CONSTATER une derive d'image, en lecture
# seule. La separation
# est deliberee : deployer une conf ne doit jamais changer une version
# d'image en passant.
#
# ---------------------------------------------------------------------
#  Le tableau
# ---------------------------------------------------------------------
#
# `vyos_container_images` fait office de tableau : aucune liste de services
# n'est ecrite ici. Ajouter une entree a l'inventaire suffit, le playbook n'a
# pas a connaitre les services.
#
#   vyos_container_images:
#     bind9: docker.io/jbsky/bind9-hardened
#     squid: docker.io/jbsky/squid-hardened
#
# SANS tag : la version se calcule, c'est le dernier tag immuable publie sur
# Docker Hub (regle et raisons dans tasks/resolve-container-images.yml). Un
# tag ecrit dans l'inventaire EPINGLE le service sur cette version -- a
# reserver a une retenue voulue.
#
# La reference doit etre COMPLETE : `registries.conf` declare un registre de
# recherche par defaut qui n'est pas Docker Hub, et un nom court interroge le
# mauvais registre.
#
# ---------------------------------------------------------------------
#  Les phases
# ---------------------------------------------------------------------
#
#   --tags check    constate la derive, ne touche a rien
#   --tags pull     telecharge les images seulement
#   --tags apply    pose les tags, commit, save, verifie, redemarre
#   --tags prune    supprime les images qu'aucun conteneur n'utilise. Jamais
#                   comprise dans « tout » : il faut la demander.
#
#   ansible-playbook image-update.yaml                # tout (sauf prune)
#   ansible-playbook image-update.yaml --tags check   # rapport seul
#   ansible-playbook image-update.yaml --tags pull    # pre-charger sans rien changer
#   ansible-playbook image-update.yaml --check        # simulation Ansible
#
# `pull` est separable a dessein : on peut pre-charger les images en journee
# et n'appliquer que dans une fenetre de maintenance. C'est aussi la phase
# qui echoue si le registre est injoignable ou le tag inexistant -- autant le
# savoir avant d'avoir touche a la configuration.
#
# ---------------------------------------------------------------------
#  Choisir les services -- avec les memes tags
# ---------------------------------------------------------------------
#
# Un nom de service en tag ne selectionne aucune tache : il filtre le tableau.
# Phases et services se combinent donc librement.
#
#   --tags squid,check          verifier squid seulement
#   --tags squid                squid seul, les trois phases
#   --tags bind9,clamav,pull    telecharger pour ces deux-la
#   --skip-tags clamav          tout sauf clamav
#   --skip-tags clamav,suricata tout sauf ces deux-la
#
# Restreindre limite aussi la transaction : un seul service retenu donne un
# seul `commit`.
#
# A LANCER PAR LA CHAINE CI, jamais a la main : ce playbook touche le DNS et
# le proxy, et un routeur casse s'isole de la machine qui voudrait le
# reparer. Garder la porte manuelle (`workflow_dispatch`) cote CI.

- name: Align VyOS container images with the inventory
  hosts: vyos
  gather_facts: false

  vars:
    _declares: "{{ vyos_container_images | default({}) | list }}"

    # Les tags servent DEUX choses a la fois : choisir la phase (check / pull /
    # apply, qui selectionnent des taches comme d'habitude) et choisir les
    # services. Un nom de service en tag ne selectionne aucune tache -- il
    # filtre le TABLEAU, via `ansible_run_tags` / `ansible_skip_tags`. C'est ce
    # qui permet de garder une seule boucle plutot qu'un bloc par service.
    _tags_inclus: "{{ ansible_run_tags | default([]) | intersect(_declares) }}"
    _tags_exclus: "{{ ansible_skip_tags | default([]) | intersect(_declares) }}"

    # Les services retenus : ceux nommes en tag, sinon tous, moins les exclus.
    _retenus: >-
      {{ (_tags_inclus if (_tags_inclus | length) > 0 else _declares)
         | difference(_tags_exclus) }}

    # Le sous-ensemble qui bouge. Evalue a l'usage, donc toujours a jour vis-a-vis
    # de `_table` -- les phases `pull` et `apply` bouclent la-dessus et rien d'autre.
    _a_changer: "{{ (_table | default([])) | selectattr('change') | list }}"

  tasks:
    - name: Fail early when the inventory declares nothing
      ansible.builtin.fail:
        msg: >-
          `vyos_container_images` est vide ou absent : ce playbook n'a rien a
          appliquer. Declarez les images attendues dans l'inventaire.
      when: (vyos_container_images | default({})) | length == 0
      # Pas `prune` : elle ne lit pas le tableau, elle porte sur tout le routeur.
      tags: [check, pull, apply]

    # `--tags squid` seul ne selectionne aucune tache : les phases portent les
    # tags check/pull/apply, pas les noms de service. Sans ce garde, le playbook
    # sortirait vert en n'ayant rien fait -- le pire des resultats.
    - name: A service tag needs a phase
      ansible.builtin.fail:
        msg: >-
          « {{ _tags_inclus | join(', ') }} » designe des services, pas des phases :
          aucune tache ne serait executee. Ajoutez une phase --
          --tags {{ _tags_inclus | join(',') }},check (ou pull, ou apply) --
          ou utilisez --skip-tags pour exclure au lieu d'inclure.
      when:
        - (_tags_inclus | length) > 0
        - (ansible_run_tags | default([]) | intersect(['check', 'pull', 'apply', 'prune'])
           | length) == 0
      tags: always

    - name: Read the image tags currently configured
      ansible.builtin.command:
        cmd: /opt/vyatta/bin/vyatta-op-cmd-wrapper show configuration commands
      register: _cfg
      changed_when: false
      check_mode: false
      tags: always

    - name: Compute the image each selected service should run
      ansible.builtin.import_tasks: tasks/resolve-container-images.yml
      vars:
        _images_a_resoudre: "{{ _retenus }}"
      tags: [check, pull, apply]

    # Le tableau de travail. Chaque entree porte deja son verdict (`change`),
    # pour que les phases suivantes se contentent d'un `selectattr` au lieu de
    # recomparer des chaines a chaque etape.
    - name: Build the working table
      ansible.builtin.set_fact:
        _table: >-
          {{ _table | default([]) + [{
               'nom': item.key,
               'voulue': _voulue,
               'actuelle': _en_place,
               'change': _en_place != _voulue,
               'retrograde': (_en_place | length) > 0
                             and (_en_place.split(':') | last)
                                 is version((_voulue.split(':') | last), '>')
             }] }}
      vars:
        _voulue: "{{ _images_attendues[item.key] }}"
        _en_place: >-
          {{ _cfg.stdout
             | regex_findall("set container name " ~ item.key ~ " image '([^']+)'")
             | first | default('') }}
      loop: >-
        {{ vyos_container_images | dict2items
           | selectattr('key', 'in', _retenus) | list }}
      loop_control:
        label: "{{ item.key }}"
      tags: [check, pull, apply]

    - name: Nothing selected
      ansible.builtin.fail:
        msg: >-
          Aucun service retenu par les tags, or l'inventaire declare :
          {{ vyos_container_images | list | join(', ') }}.
      when: (_table | default([])) | length == 0
      tags: [check, pull, apply]

    # Une image plus ancienne que celle qui tourne n'est presque jamais voulue.
    # Le cas s'est produit quand l'inventaire portait les tags -- il declarait
    # suricata 8.0.6.18 alors que le routeur tournait en 8.0.6.20. Avec des
    # versions calculees, il reste deux causes : un epinglage ancien, ou un
    # tag retire du registre apres avoir ete deploye. On refuse par defaut.
    - name: Refuse to downgrade unless asked explicitly
      ansible.builtin.fail:
        msg: >-
          RETROGRADATION refusee :
          {% for i in _a_retrograder %}
          {{ i.nom }} tourne en {{ i.actuelle.split(':') | last }}, la version
          attendue est {{ i.voulue.split(':') | last }}{{ ', ' if not loop.last else '' }}
          {%- endfor %}.
          Soit l'inventaire epingle une version ancienne, soit le registre ne
          publie plus la version deployee. Si la retrogradation est voulue,
          relancez avec -e allow_downgrade=true.
      when:
        - not (allow_downgrade | default(false) | bool)
        - (_a_retrograder | length) > 0
      vars:
        _a_retrograder: "{{ (_table | default([])) | selectattr('retrograde') | list }}"
      # Volontairement PAS `always` : ce garde protege le ROUTEUR, donc il ne
      # concerne que les phases qui l'atteignent. `check` doit rapporter, pas
      # echouer.
      tags: [pull, apply]

    # --- check ---------------------------------------------------------

    - name: "check — etat de chaque service"
      ansible.builtin.debug:
        msg: >-
          {{ item.nom }} :
          {{ ((item.actuelle | default('(aucune)', true)) ~ ' -> ' ~ item.voulue
              ~ ('   [RETROGRADATION]' if item.retrograde else ''))
             if item.change else 'deja en ' ~ item.voulue }}
      loop: "{{ _table | default([]) }}"
      loop_control:
        label: "{{ item.nom }}"
      tags: [check, pull, apply]

    - name: "check — resume"
      ansible.builtin.debug:
        msg: >-
          {{ _a_changer | length }} image(s) a mettre a jour sur
          {{ (_table | default([])) | length }} retenue(s)
          {{ '(sur ' ~ (_declares | length) ~ ' declarees)' if (_retenus | length) < (_declares | length) else '' }}.
      tags: [check, pull, apply]

    # --- pull ----------------------------------------------------------
    # Volontairement AVANT toute ecriture : un echec ici -- registre
    # injoignable, tag inexistant -- laisse le routeur exactement dans l'etat
    # ou on l'a trouve. Sans pre-tirage, le commit detruit le container
    # existant avant d'echouer a creer le nouveau, et le service reste a terre.

    - name: "pull — telecharger les images qui changent"
      ansible.builtin.command:
        cmd: "/opt/vyatta/bin/vyatta-op-cmd-wrapper add container image {{ item.voulue }}"
      loop: "{{ _a_changer }}"
      loop_control:
        label: "{{ item.nom }} -> {{ item.voulue }}"
      changed_when: true
      when: not ansible_check_mode
      tags: [pull, apply]

    # --- apply ---------------------------------------------------------
    # Un seul appel : `begin`/`set`/`commit`/`save`/`end` ne survivent pas a un
    # changement de shell, et chaque tache Ansible en ouvre un neuf.
    #
    # Quatre details, tous payes une fois :
    #
    # 1. `source /etc/default/vyatta` sort en 1 sur VyOS alors qu'il a bien
    #    peuple `$vyos_validators_dir`. Sans `|| true`, `set -e` tue le script
    #    ICI : rc=1, aucune sortie, 4 ms.
    # 2. Le wrapper exige le groupe `vyattacfg` (c'est ecrit en tete de
    #    `/opt/vyatta/sbin/vyatta-cfg-cmd-wrapper`). L'utilisateur Ansible en
    #    est membre, mais ce n'est pas son groupe primaire : d'ou le `sg`.
    # 3. `end` (teardownSession) demonte l'unionfs de la session. Il a rendu 1
    #    le 2026-09-09 APRES un `commit` et un `save` tous deux reussis : la
    #    tache a signale un echec sur une operation entierement passee, et les
    #    deux taches de verification qui suivent n'ont jamais tourne. Le
    #    demontage est du menage, il n'a pas a decider du sort de la tache --
    #    la preuve, c'est la relecture de la configuration, plus bas.
    # 4. `become: false`. Un inventaire qui declare `ansible_become: true` pour
    #    l'hote fait jouer CETTE tache en root, et un commit joue en root laisse
    #    les noeuds de `/opt/vyatta/config/active/` sans le groupe `vyattacfg`.
    #    Constate le 2026-09-10 : plus aucune modification n'etait possible en
    #    utilisateur normal -- `configure` s'ouvrait, le `commit` echouait, parce
    #    que c'est lui qui ecrit dans `active/`. Le mecanisme exact n'est PAS
    #    etabli (le `sg` ci-dessus aurait du suffire) ; le declencheur, lui, l'est.
    #    La tache n'a de toute facon aucun besoin de root : `sg vyattacfg` donne
    #    au wrapper tout ce qu'il exige, et c'est la forme exacte d'un commit
    #    interactif. Ne pas rendre l'hote entier `become: false` pour autant --
    #    les taches qui deposent des fichiers de conf, elles, en ont besoin.

    - name: "apply — poser les tags, commit et save"
      become: false
      ansible.builtin.shell:
        cmd: |
          sg vyattacfg -c '
          set -e
          source /etc/default/vyatta || true
          W=/opt/vyatta/sbin/vyatta-cfg-cmd-wrapper
          $W begin
          {% for i in _a_changer %}
          $W set container name {{ i.nom }} image "{{ i.voulue }}"
          {% endfor %}
          $W commit
          $W save
          $W end || echo "AVERTISSEMENT: teardownSession a rendu $?, la session reste montee sous /opt/vyatta/config/tmp/" >&2
          '
        executable: /bin/bash
      changed_when: true
      when:
        - _a_changer | length > 0
        - not ansible_check_mode
      tags: [apply]

    # Le wrapper est SILENCIEUX quand il reussit : une sortie vide n'est ni un
    # echec ni un commit en cours. La seule preuve est de relire.

    - name: "apply — relire la configuration"
      ansible.builtin.command:
        cmd: /opt/vyatta/bin/vyatta-op-cmd-wrapper show configuration commands
      register: _cfg_apres
      changed_when: false
      when:
        - _a_changer | length > 0
        - not ansible_check_mode
      tags: [apply]

    - name: "apply — verifier que le routeur montre bien l'image declaree"
      ansible.builtin.assert:
        that:
          - (_cfg_apres.stdout
             | regex_findall("set container name " ~ item.nom ~ " image '([^']+)'")
             | first | default('')) == item.voulue
        fail_msg: >-
          « {{ item.nom }} » devait passer en {{ item.voulue }}, la configuration
          montre {{ (_cfg_apres.stdout
                     | regex_findall("set container name " ~ item.nom ~ " image '([^']+)'")
                     | first | default('(rien)')) }}.
        success_msg: "{{ item.nom }} : {{ item.voulue }}"
        quiet: true
      loop: "{{ _a_changer }}"
      loop_control:
        label: "{{ item.nom }}"
      when:
        - _a_changer | length > 0
        - not ansible_check_mode
      tags: [apply]

    # Le commit a recree les containers HORS du chemin systemd. Pour squid,
    # cela fait disparaitre les regles nft REDIRECT en silence et tout le VLAN
    # perd HTTPS -- sans qu'aucune sonde applicative ne bronche, le proxy
    # lui-meme allant tres bien. `restart container` repasse par l'unite
    # systemd, qui redeclenche le service de redirection.

    - name: "apply — redemarrer par systemd"
      ansible.builtin.command:
        cmd: "/opt/vyatta/bin/vyatta-op-cmd-wrapper restart container {{ item.nom }}"
      loop: "{{ _a_changer }}"
      loop_control:
        label: "{{ item.nom }}"
      changed_when: true
      when: not ansible_check_mode
      tags: [apply]

    # Une session dont le `end` a echoue laisse son unionfs monte. C'est sans
    # consequence pour le service et ca disparait au redemarrage du routeur,
    # mais il n'y a aucun moyen de le nettoyer sans root -- donc on le dit.

    - name: "apply — compter les sessions de configuration residuelles"
      ansible.builtin.shell:
        cmd: "ls -d /opt/vyatta/config/tmp/new_config_* 2>/dev/null | wc -l"
      register: _sessions_restantes
      changed_when: false
      failed_when: false
      when: not ansible_check_mode
      tags: [apply]

    - name: "apply — signaler les sessions residuelles"
      ansible.builtin.debug:
        msg: >-
          {{ _sessions_restantes.stdout | trim }} session(s) de configuration
          restent montees sous /opt/vyatta/config/tmp/ : un `end` a echoue a
          demonter son unionfs. Sans effet sur le service, nettoye au
          redemarrage du routeur.
      when:
        - not ansible_check_mode
        - (_sessions_restantes.stdout | default('0') | trim | int) > 0
      tags: [apply]

    # --- prune ---------------------------------------------------------
    # Supprime les images qu'aucun conteneur n'utilise. Phase GLOBALE : elle
    # porte sur toutes les images du routeur, pas sur le tableau. Un nom de
    # service ne la restreint pas, et un conteneur absent de l'inventaire
    # (declare a la main dans la configuration) protege quand meme son image.
    #
    # Taguee `never` : elle ne tourne que demandee (`--tags prune`), jamais dans
    # un run sans tag. Supprimer l'image precedente, c'est renoncer a revenir en
    # arriere sans retelecharger ; ca se decide, ca ne vient pas en passant.
    #
    # Une image est GARDEE des que l'une de ces conditions tient :
    #   - un conteneur existe dessus (champ `containers` de podman, conteneurs
    #     arretes compris) ;
    #   - une ligne `image` de la configuration la designe. Cette configuration
    #     est relue ICI : apres un `apply` dans le meme run, la lecture du debut
    #     du play designerait encore les anciennes images. Cette condition
    #     couvre un conteneur declare mais absent a cet instant -- sans son
    #     image, le prochain commit echouerait.
    #
    # Suppression par IDENTIFIANT, une image a la fois, par la commande op-mode,
    # qui refuse d'elle-meme une image dont un conteneur tourne. Jamais
    # `delete container image all`.
    #
    # `become: false` : l'op-mode n'a pas besoin de root, et un sudo sur le
    # routeur est ce qui a deja casse le config tree (cf. apply).

    - name: "prune — relire la configuration et les images"
      become: false
      ansible.builtin.command:
        cmd: "/opt/vyatta/bin/vyatta-op-cmd-wrapper {{ item }}"
      loop:
        - show configuration commands
        - show container image json
      register: _prune_lecture
      changed_when: false
      check_mode: false
      tags: [prune, never]

    # Une reference sans tag designe `:latest`. Une image correspond a une
    # reference si l'un de ses noms (ou digests) lui est egal, ou s'y termine
    # apres un « / » : un nom court de la configuration (`haproxy:3`) est
    # complete par podman (`dhi.io/haproxy:3`).
    #
    # Les boucles Jinja rendent du TEXTE, pas une liste : d'ou le passage
    # explicite par JSON (`to_json` dans le modele, `from_json` a l'usage).
    - name: "prune — choisir les images a supprimer"
      ansible.builtin.set_fact:
        _prune_references: "{{ _references }}"
        _prune_images: "{{ _images }}"
        _a_purger: "{{ _choix | from_json }}"
      vars:
        _choix: >-
          {% set out = [] %}
          {% for img in _images %}
          {%   set noms = (img.names | default([], true)) + (img.repo_digests | default([], true)) %}
          {%   set ns = namespace(designee=false) %}
          {%   for r in _references %}{% for n in noms %}
          {%     if n == r or n.endswith('/' ~ r) %}{% set ns.designee = true %}{% endif %}
          {%   endfor %}{% endfor %}
          {%   if not ns.designee and (img.containers | default(0) | int) == 0 %}
          {%     set _ = out.append({'id': img.id, 'noms': img.names | default([], true), 'taille': img.size | default(0)}) %}
          {%   endif %}
          {% endfor %}
          {{ out | to_json }}
        _images: "{{ _prune_lecture.results[1].stdout | from_json }}"
        # Aucun antislash dans ces expressions : `\\S+` dans un bloc YAML ne
        # correspondait a rien, la liste sortait VIDE et toute image sans
        # conteneur devenait supprimable -- vu au banc, pas en production.
        _toutes: >-
          {{ _prune_lecture.results[0].stdout
             | regex_findall("set container name [^ ]+ image '([^']+)'") }}
        _references: >-
          {{ (_toutes | select('search', ':[^/]+$|@') | list)
             + (_toutes | reject('search', ':[^/]+$|@') | map('regex_replace', '$', ':latest') | list) }}
      tags: [prune, never]

    - name: "prune — ce qui sera supprime"
      ansible.builtin.debug:
        msg: >-
          {{ _a_purger | length }} image(s) sans conteneur ni reference sur
          {{ _prune_images | length }}
          ({{ ((_a_purger | map(attribute='taille') | sum) / 1000000) | round | int }} Mo)
          {%- for i in _a_purger %}{{ ' : ' if loop.first else ', ' }}{{ (i.noms | join(' ')) or '<sans nom>' }} ({{ i.id[:12] }}){% endfor %}
      tags: [prune, never]

    - name: "prune — supprimer"
      become: false
      ansible.builtin.command:
        cmd: "/opt/vyatta/bin/vyatta-op-cmd-wrapper delete container image {{ item.id }}"
      loop: "{{ _a_purger }}"
      loop_control:
        label: "{{ (item.noms | join(' ')) or item.id[:12] }}"
      changed_when: true
      when: not ansible_check_mode
      tags: [prune, never]

    # Le controle qui compte : pas « les conteneurs tournent encore » -- un
    # conteneur survit a la disparition de son image, et l'absence ne se paie
    # qu'au prochain commit ou `restart container`. On verifie que chaque
    # image designee par la configuration est toujours la.
    - name: "prune — relire les images"
      become: false
      ansible.builtin.command:
        cmd: /opt/vyatta/bin/vyatta-op-cmd-wrapper show container image json
      register: _prune_apres
      changed_when: false
      when:
        - not ansible_check_mode
        - _a_purger | length > 0
      tags: [prune, never]

    - name: "prune — chaque image de la configuration est toujours la"
      ansible.builtin.assert:
        that: (_absentes | from_json) | length == 0
        fail_msg: >-
          Images designees par la configuration mais absentes du routeur :
          {{ _absentes | from_json | join(', ') }}. Le prochain commit ou `restart container`
          echouera : `add container image <reference>` pour chacune.
        success_msg: "{{ _prune_references | length }} reference(s) de la configuration toujours presentes"
        quiet: true
      vars:
        _noms: >-
          {{ (_prune_apres.stdout | from_json | map(attribute='names') | select | flatten)
             + (_prune_apres.stdout | from_json | map(attribute='repo_digests') | select | flatten) }}
        _absentes: >-
          {% set out = [] %}
          {% for r in _prune_references %}
          {%   if _noms | select('equalto', r) | list | length == 0
                  and _noms | select('search', '/' ~ (r | regex_escape) ~ '$') | list | length == 0 %}
          {%     set _ = out.append(r) %}
          {%   endif %}
          {% endfor %}
          {{ out | to_json }}
      when:
        - not ansible_check_mode
        - _a_purger | length > 0
      tags: [prune, never]
