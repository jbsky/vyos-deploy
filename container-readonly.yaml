---
# ansible-playbook container-readonly.yaml -i <ton-inventaire> --tags <phase>
#
# Rootfs en lecture seule des conteneurs VyOS : CONSTAT et RETOUR ARRIERE
# D'URGENCE seulement.
#
# La mise en place vit dans `image-update.yaml` (phase apply, bloc « lecture
# seule ») : les conteneurs se mettent a jour par la, et c'est la que
# tmpfs/volumes, reglage global et redemarrages verifies sont geres
# ensemble. Ce playbook-ci ne pose rien.
#
#   --tags check     reglage global pose ? ReadonlyRootfs de chaque conteneur
#   --tags rollback  retire le reglage global et redemarre tout, un a la fois.
#                    Jamais compris dans « tout » : il faut le demander.
#
# Le rollback d'ici est un bouton d'URGENCE : tant que l'inventaire garde
# `vyos_container_readonly_enabled: true`, le prochain image-update apply
# reposera le reglage. Le retour arriere DURABLE, c'est
# `vyos_container_readonly_enabled: false` puis image-update apply (qui
# retire le reglage et redemarre tout lui aussi).
#
# A LANCER PAR LA CHAINE CI, jamais a la main : le rollback redemarre le DNS
# et le proxy.

- name: Read-only rootfs for VyOS containers — check and rollback
  hosts: vyos
  gather_facts: false

  vars:
    _dropin: /etc/containers/containers.conf.d/50-read-only.conf
    _preconfig: /config/scripts/vyos-preconfig-bootup.script
    _marker: "# {mark} container-readonly (vyos-deploy)"
    _cibles: "{{ vyos_container_readonly | default([]) }}"

  tasks:

    - name: Refuser un tableau vide
      ansible.builtin.assert:
        that: _cibles | length > 0
        fail_msg: vyos_container_readonly est vide ou absent.
        quiet: true
      tags: always

    - name: "check — reglage global present ?"
      ansible.builtin.stat:
        path: "{{ _dropin }}"
      register: _dropin_stat
      tags: [check]

    - name: "check — etat des conteneurs"
      ansible.builtin.command:
        cmd: >-
          podman inspect {{ item.name }}
          --format '{{ '{{' }}.State.Status{{ '}}' }} ro={{ '{{' }}.HostConfig.ReadonlyRootfs{{ '}}' }}'
      loop: "{{ _cibles }}"
      loop_control:
        label: "{{ item.name }}"
      register: _etat
      changed_when: false
      failed_when: false
      tags: [check]

    - name: "check — rapport"
      ansible.builtin.debug:
        msg: >-
          reglage global {{ 'POSE' if _dropin_stat.stat.exists else 'absent' }} ;
          inventaire : {{ 'active' if (vyos_container_readonly_enabled | default(false) | bool) else 'desactive' }} ;
          {% for r in _etat.results %}{{ r.item.name }}: {{ (r.stdout | default('') | trim) or (r.stderr | default('?') | trim) }}{{ ' ; ' if not loop.last }}{% endfor %}
      tags: [check]

    # Un commit VyOS en cours pendant des redemarrages : routeur a redemarrer
    # (vecu le 2026-10-02).
    - name: "rollback — aucun commit VyOS en cours"
      ansible.builtin.command:
        cmd: pgrep -f my_commit
      register: _commit_en_cours
      changed_when: false
      failed_when: _commit_en_cours.rc == 0
      tags: [rollback, never]

    - name: "rollback — retirer le reglage global"
      ansible.builtin.file:
        path: "{{ _dropin }}"
        state: absent
      tags: [rollback, never]

    - name: "rollback — retirer sa recreation au boot"
      ansible.builtin.blockinfile:
        path: "{{ _preconfig }}"
        marker: "{{ _marker }}"
        state: absent
      tags: [rollback, never]

    - name: "rollback — redemarrer et verifier, un conteneur a la fois"
      ansible.builtin.include_tasks:
        file: tasks/readonly-restart-verify.yml
        apply:
          tags: [rollback]
      loop: "{{ _cibles }}"
      loop_control:
        loop_var: _c
        label: "{{ _c.name }}"
      vars:
        _ro_attendu: false
      tags: [rollback, never]
