# Transmission des journaux de Suricata (eve.json, fast.log) au syslog du
# routeur, qui les envoie a VictoriaLogs (system syslog remote). Deployee par
# suricata-deploy.yaml (tag rsyslog) dans /etc/rsyslog.d/10-suricata.conf,
# conservee dans /config/etc/rsyslog/ et REINSTALLEE a chaque boot (/etc
# appartient a l'image systeme : une montee d'image VyOS la perdait). La copie
# de /config etait d'ailleurs une version anterieure, sans reopenOnTruncate.
module(load="imfile" PollingInterval="10")

# reopenOnTruncate : la rotation logrotate de ces fichiers est en
# copytruncate (meme inode, fichier tronque a 0). Sans cette option (off par
# defaut), imfile garde son offset pre-rotation (ex: 83 Mo) et attend que le
# fichier "rattrape" -> plus AUCUN log forwarde apres chaque rotation
# (panne totale constatee du 5 au 9 juillet 2026).
input(
    type="imfile"
    File="/var/log/suricata/eve.json"
    Tag="suricata"
    Severity="info"
    Facility="local6"
    reopenOnTruncate="on"
)

input(
    type="imfile"
    File="/var/log/suricata/fast.log"
    Tag="suricata-fast"
    Severity="info"
    Facility="local6"
    reopenOnTruncate="on"
)
