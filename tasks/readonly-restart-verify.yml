---
# Verifie qu'UN conteneur tient, apres l'avoir redemarre par son unite systemd
# si on le demande. Appele en boucle par image-update.yaml (apply) et
# container-readonly.yaml (rollback), loop_var: _c ; un echec arrete le play,
# donc les conteneurs suivants ne sont pas touches.
#
# « Tient » = en marche, ReadonlyRootfs conforme, image attendue, et MEME date
# de demarrage a un instant d'intervalle : un conteneur qui plante est relance
# par `restart on-failure`, et une seule lecture le verrait « running ».
#
# `_c.restart` (vrai par defaut) : a faux, on ne fait que VERIFIER -- le commit
# de VyOS a deja redemarre le conteneur par la meme unite systemd, et le
# redemarrer derriere lui coupe le service une 2e fois pour rien
# (cf. image-update.yaml, « conteneurs a redemarrer ou a verifier »).
# `_c.image` (vide par defaut) : l'image attendue sur le conteneur qui tourne.
# `_c.settle` : la fenetre de stabilite ; sans redemarrage, l'init a eu lieu
# plusieurs minutes plus tot, 5 s suffisent a prouver qu'il ne boucle pas.

- name: "{{ _c.name }} — redemarrer par systemd"
  become: false
  ansible.builtin.command:
    cmd: "/opt/vyatta/bin/vyatta-op-cmd-wrapper restart container {{ _c.name }}"
  changed_when: true
  when: _c.restart | default(true) | bool

- name: "{{ _c.name }} — attendre qu'il tourne"
  ansible.builtin.command:
    cmd: >-
      podman inspect {{ _c.name }}
      --format '{{ '{{' }}.State.Status{{ '}}' }}|{{ '{{' }}.HostConfig.ReadonlyRootfs{{ '}}' }}|{{ '{{' }}.State.StartedAt{{ '}}' }}|{{ '{{' }}.ImageName{{ '}}' }}'
  register: _r1
  until: _r1.rc == 0 and _r1.stdout.split('|')[0] == 'running'
  retries: 12
  delay: 5
  changed_when: false

- name: "{{ _c.name }} — laisser passer l'init"
  ansible.builtin.pause:
    seconds: "{{ (_c.settle | default(20)) if (_c.restart | default(true) | bool) else 5 }}"

- name: "{{ _c.name }} — relire"
  ansible.builtin.command:
    cmd: >-
      podman inspect {{ _c.name }}
      --format '{{ '{{' }}.State.Status{{ '}}' }}|{{ '{{' }}.HostConfig.ReadonlyRootfs{{ '}}' }}|{{ '{{' }}.State.StartedAt{{ '}}' }}|{{ '{{' }}.ImageName{{ '}}' }}'
  register: _r2
  changed_when: false

- name: "{{ _c.name }} — verifier"
  ansible.builtin.assert:
    that:
      - _r2.stdout.split('|')[0] == 'running'
      - _r2.stdout.split('|')[1] == (_ro_attendu | string | lower)
      - _r2.stdout.split('|')[2] == _r1.stdout.split('|')[2]
      # L'image du conteneur QUI TOURNE, pas celle de la configuration : VyOS
      # pose la ligne `set`, commite, et passe le redemarrage en silence quand
      # l'image manque en local (`podman image exists` != 0 -> continue).
      - (_c.image | default('')) | length == 0
        or _r2.stdout.split('|')[3] == _c.image
    fail_msg: >-
      {{ _c.name }} ne tient pas : avant « {{ _r1.stdout }} », apres
      « {{ _r2.stdout }} » (attendu running, ReadonlyRootfs={{ _ro_attendu | string | lower }},
      date de demarrage inchangee{{ ', image ' ~ _c.image if (_c.image | default('')) | length > 0 else '' }}).
      Journal : `show container log {{ _c.name }}`.
      Retour arriere : container-readonly.yaml --tags rollback (urgence),
      puis vyos_container_readonly_enabled: false (durable).
    success_msg: >-
      {{ _c.name }} : running, ReadonlyRootfs={{ _r2.stdout.split('|')[1] }}{{
        ', image ' ~ _r2.stdout.split('|')[3] if (_c.image | default('')) | length > 0 else '' }}{{
        '' if (_c.restart | default(true) | bool) else ' (redemarre par le commit, verifie seulement)' }}
