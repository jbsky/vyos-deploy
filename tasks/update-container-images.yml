---
# Met les images des containers a la version declaree par l'inventaire.
#
# Pendant longtemps ce depot ne savait que CONSTATER la derive
# (`check-container-images.yml`, lecture seule). Ce fichier-ci l'applique.
# Les deux restent separes a dessein : les playbooks de deploiement de
# configuration continuent d'appeler le controle, jamais la mise a jour --
# deployer une conf ne doit pas changer une version d'image en passant.
#
# Utilisation : via `image-update.yaml`, qui n'existe que pour ca.
#
# Ce qu'il faut savoir avant de lire :
#
# 1. Le tag vit dans `config.boot`, pas dans un fichier. Il se pose par le
#    wrapper de CONFIGURATION (`vyatta-cfg-cmd-wrapper`), distinct du wrapper
#    op-mode utilise ailleurs dans ce depot.
# 2. `begin`/`set`/`commit`/`save`/`end` doivent tenir dans UN SEUL appel :
#    chaque tache Ansible ouvre un shell neuf, et une session de
#    configuration ne survit pas au precedent.
# 3. `source /etc/default/vyatta` est obligatoire -- avec `;`, pas `&&`.
#    Sans lui, `$vyos_validators_dir` est vide et tout validateur echoue sur
#    « Could not execute validator ».
# 4. Le wrapper est SILENCIEUX en cas de succes. Une sortie vide n'est ni un
#    echec ni un commit en cours : on verifie l'effet, jamais la sortie.
# 5. L'image doit etre PRE-TIREE. Sans elle en local, le commit detruit le
#    container existant avant d'echouer a creer le nouveau, et le service
#    reste a terre.

- name: Read the container image tags currently configured
  ansible.builtin.command:
    cmd: /opt/vyatta/bin/vyatta-op-cmd-wrapper show configuration commands
  register: _vyos_cfg_before
  changed_when: false
  check_mode: false

- name: Work out which containers drift from the inventory
  ansible.builtin.set_fact:
    _image_updates: >-
      {{ _image_updates | default([]) + ([{
           'nom': item.key,
           'voulue': item.value,
           'actuelle': (_vyos_cfg_before.stdout
                        | regex_findall("set container name " ~ item.key ~ " image '([^']+)'")
                        | first | default(''))
         }] if (_vyos_cfg_before.stdout
                | regex_findall("set container name " ~ item.key ~ " image '([^']+)'")
                | first | default('')) != item.value else []) }}
  loop: "{{ vyos_container_images | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  check_mode: false

- name: Report what will change
  ansible.builtin.debug:
    msg: >-
      {{ (_image_updates | default([])) | length }} image(s) a mettre a jour :
      {{ (_image_updates | default([]))
         | map(attribute='nom') | list | join(', ') | default('aucune', true) }}

- name: Nothing to do
  ansible.builtin.meta: end_play
  when: (_image_updates | default([])) | length == 0

# --- Pre-tirage -------------------------------------------------------
# Separe du commit, et volontairement place AVANT lui : un echec ici laisse
# le routeur exactement dans l'etat ou on l'a trouve.

- name: Pre-pull the images before touching the configuration
  ansible.builtin.command:
    cmd: >-
      /opt/vyatta/bin/vyatta-op-cmd-wrapper add container image {{ item.voulue }}
  loop: "{{ _image_updates }}"
  loop_control:
    label: "{{ item.nom }} -> {{ item.voulue }}"
  register: _pull
  changed_when: true
  failed_when: _pull.rc != 0
  when: not ansible_check_mode

# --- Transaction de configuration -------------------------------------
# Un seul appel, un seul commit : soit les images bougent ensemble, soit
# aucune ne bouge. Un commit par container laisserait le routeur dans un
# etat mixte si le second echouait.

- name: Set the image tags, commit and save
  ansible.builtin.shell:
    cmd: |
      set -e
      source /etc/default/vyatta;
      W=/opt/vyatta/sbin/vyatta-cfg-cmd-wrapper
      $W begin
      {% for u in _image_updates %}
      $W set container name {{ u.nom }} image '{{ u.voulue }}'
      {% endfor %}
      $W commit
      $W save
      $W end
    executable: /bin/bash
  register: _cfg
  changed_when: true
  when: not ansible_check_mode

# --- Verification -----------------------------------------------------
# Le wrapper ne dit rien en cas de succes : la seule preuve est de relire.

- name: Read the configuration back
  ansible.builtin.command:
    cmd: /opt/vyatta/bin/vyatta-op-cmd-wrapper show configuration commands
  register: _vyos_cfg_after
  changed_when: false
  when: not ansible_check_mode

- name: Fail if the configuration does not show the declared image
  ansible.builtin.assert:
    that:
      - (_vyos_cfg_after.stdout
         | regex_findall("set container name " ~ item.nom ~ " image '([^']+)'")
         | first | default('')) == item.voulue
    fail_msg: >-
      « {{ item.nom }} » devait passer en {{ item.voulue }}, la configuration
      montre {{ (_vyos_cfg_after.stdout
                 | regex_findall("set container name " ~ item.nom ~ " image '([^']+)'")
                 | first | default('(rien)')) }}.
    success_msg: "{{ item.nom }} : {{ item.voulue }}"
    quiet: true
  loop: "{{ _image_updates }}"
  loop_control:
    label: "{{ item.nom }}"
  when: not ansible_check_mode

# --- Redemarrage ------------------------------------------------------
# Le commit a recree les containers HORS du chemin systemd. Pour squid,
# cela fait disparaitre les regles nft REDIRECT en silence et tout le VLAN
# concerne perd HTTPS -- sans qu'aucune sonde applicative ne bronche, le
# proxy lui-meme allant tres bien. `restart container` repasse par l'unite
# systemd, qui redeclenche le service de redirection.
#
# On redemarre TOUS les containers touches, pas seulement squid : c'est le
# seul moyen de garantir qu'ils sont sous systemd apres un commit.

- name: Restart the containers through systemd
  ansible.builtin.command:
    cmd: >-
      /opt/vyatta/bin/vyatta-op-cmd-wrapper restart container {{ item.nom }}
  loop: "{{ _image_updates }}"
  loop_control:
    label: "{{ item.nom }}"
  changed_when: true
  when: not ansible_check_mode

- name: Remind that the inventory is now the only source of truth
  ansible.builtin.debug:
    msg: >-
      Images mises a jour. L'inventaire et le routeur sont alignes :
      `check-container-images.yml` passera. Si vous avez modifie un tag
      ailleurs, relevez-le avec
      « show configuration commands | grep 'container name .* image' ».
