# ansible-playbook proxy-deploy.yaml -i <ton-inventaire>
#
# Déploie la configuration de la stack proxy (Squid + c-icap + ClamAV)
# sur les containers Podman de VyOS.
#
# Les fichiers source sont dans etc/{squid,c-icap,clamav}/ (versionnés dans
# git). Ce repo ne fournit pas d'inventaire -- vois le README pour cibler
# le groupe Ansible "vyos" depuis ton propre inventaire (usage standalone
# ou en submodule Git).
# Les certs Squid SSL-bump (bump.pem, dhparam.pem) sont dans le vault VyOS.
# Les fichiers non gérés (base virale ClamAV, mime.conf, c-icap.magic) ne
# sont PAS touchés.
#
# Containers et IPs (réseau podman 172.20.1.0/24, exemple) :
#   squid   → 172.20.1.10  (ports 3128/3130)
#   c-icap  → 172.20.1.30  (port 1344)
#   clamav  → 172.20.1.20  (port 3310)
#
# Tags disponibles :
#   config        → copier les fichiers de conf sur VyOS
#   certs         → déployer les certificats SSL (bump CA + DH params)
#   service       → redémarrer les containers (clamav → c-icap → squid)
#   check         → vérifier que le proxy fonctionne
#   squid_config  → copier uniquement la conf Squid
#   squid_certs   → déployer uniquement les certs Squid SSL-bump
#   icap_config   → copier uniquement la conf c-icap + squidclamav
#   clamav_config → copier uniquement la conf ClamAV
#   redirect      → unite squid-redirect (regles nft du proxy transparent),
#                   relancee a chaque demarrage de squid ; ne la redemarre pas
#
# Exemples :
#   ansible-playbook proxy-deploy.yaml
#   ansible-playbook proxy-deploy.yaml --tags config
#   ansible-playbook proxy-deploy.yaml --tags squid_config
#   ansible-playbook proxy-deploy.yaml --tags check
#   ansible-playbook proxy-deploy.yaml --tags service

- name: Deploy proxy stack config to VyOS containers
  hosts: vyos
  gather_facts: false
  vars:
    vyos_base: /config/containers
    # UIDs matching container users
    squid_uid: "3128"
    icap_uid: "4100"
    clamav_uid: "4000"

  pre_tasks:
    # Garde-fou de version : echoue si le routeur fait tourner une image
    # differente de celle que l'inventaire declare. Lecture seule, sans
    # effet si `vyos_container_images` n'est pas defini. Voir
    # tasks/check-container-images.yml pour le pourquoi.
    - name: Check the running container images against the inventory
      ansible.builtin.include_tasks: tasks/check-container-images.yml
      vars:
        _checked_containers: ["squid", "c-icap", "clamav"]
      tags: always

    # squid_conf/cicap_conf/clam_conf ne sont PAS mises dans vars: ci-dessus :
    # les vars de play ont une priorite plus haute que les group_vars/host_vars
    # d'inventaire, ce qui empecherait un inventaire de fournir sa propre
    # valeur. Le default() ci-dessous ne s'applique que si rien (inventaire
    # ni -e) ne le fournit.
    - name: Resolve config source paths (inventory override wins over bundled example)
      ansible.builtin.set_fact:
        squid_conf: "{{ squid_conf | default(playbook_dir + '/etc/squid') }}"
        cicap_conf: "{{ cicap_conf | default(playbook_dir + '/etc/c-icap') }}"
        clam_conf: "{{ clam_conf | default(playbook_dir + '/etc/clamav') }}"
        squid_redirect_unit: "{{ squid_redirect_unit | default(playbook_dir + '/etc/systemd/squid-redirect.service') }}"
        # table du PBR (policy route ... set table N) et IP du conteneur squid
        tproxy_table: "{{ tproxy_table | default(100) }}"
        tproxy_nexthop: "{{ tproxy_nexthop | default('172.20.0.10') }}"
      delegate_to: localhost
      tags: always

    - name: Check source directories exist
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ squid_conf }}/squid.conf"
        - "{{ cicap_conf }}/c-icap.conf"
        - "{{ clam_conf }}/clamd.conf"
      delegate_to: localhost
      register: _conf_check
      tags: [proxy_deploy, config, certs, squid_config, squid_certs, icap_config, clamav_config, service, check]

    - name: Fail if a source directory is missing
      ansible.builtin.fail:
        msg: "{{ item.item }} not found."
      loop: "{{ _conf_check.results }}"
      when: not item.stat.exists
      loop_control:
        label: "{{ item.item }}"
      tags: [proxy_deploy, config, certs, squid_config, squid_certs, icap_config, clamav_config, service, check]

  tasks:
    # ── Squid SSL certs (from vault) ─────────────────────────
    # Pas de delegate_to/become explicite : ansible_become: true (host_vars)
    # s'applique par defaut a toutes les taches ci-dessous, qui tournent
    # normalement sur l'hote cible via la connexion Ansible (sudo distant).
    - name: Ensure squid ssl_cert directory exists
      ansible.builtin.file:
        path: "{{ vyos_base }}/squid/conf/ssl_cert"
        state: directory
        mode: "0755"
      tags: [certs, squid_certs]

    - name: Deploy squid bump CA (from vault)
      ansible.builtin.copy:
        content: "{{ vault_squid_bump_pem }}"
        dest: "{{ vyos_base }}/squid/conf/ssl_cert/bump.pem"
        mode: "0644"
      notify: Restart squid
      tags: [certs, squid_certs]

    - name: Deploy squid DH parameters (from vault)
      ansible.builtin.copy:
        content: "{{ vault_squid_dhparam_pem }}"
        dest: "{{ vyos_base }}/squid/conf/ssl_cert/dhparam.pem"
        mode: "0644"
      notify: Restart squid
      tags: [certs, squid_certs]

    # ── Squid ──────────────────────────────────────────────────
    # Copie recursive de tout le dossier plutot qu'une tache par fichier :
    # peu importe les noms exacts (l'exemple generique et une vraie conf
    # perso n'ont pas forcement les memes fichiers ACL), owner/group
    # s'appliquent a tout l'arbre, et --check/--diff fonctionnent quand
    # meme nativement. Destination sous squid/conf/ : c'est ce dossier
    # qui est monte en volume sur /etc/squid dans le container (voir
    # config.boot VyOS). squid.conf reference aussi mime.conf et
    # conf.d/*.conf (fatal si aucun .conf n'existe, d'ou le placeholder
    # empty.conf) et acl/*.txt -- tout part avec cette meme copie.
    - name: Deploy squid config directory
      ansible.builtin.copy:
        src: "{{ squid_conf }}/"
        dest: "{{ vyos_base }}/squid/conf/"
        owner: root
        group: "{{ squid_uid }}"
      notify: Restart squid
      tags: [config, squid_config]

    # ── c-icap ─────────────────────────────────────────────────
    # Destination sous c-icap/ (volume unique, monte sur /etc/c-icap).
    # Meme logique : copie recursive (inclut c-icap.magic).
    - name: Deploy c-icap config directory
      ansible.builtin.copy:
        src: "{{ cicap_conf }}/"
        dest: "{{ vyos_base }}/c-icap/"
        owner: "{{ icap_uid }}"
        group: "{{ icap_uid }}"
        mode: "0640"
      notify: Restart c-icap
      tags: [config, icap_config]

    # ── ClamAV ─────────────────────────────────────────────────
    # Volumes VyOS clamav/conf + clamav/db (config.boot) -- la base virale
    # (clamav/db) est geree par freshclam a l'interieur du container, ce
    # playbook ne touche qu'a clamav/conf.
    - name: Deploy clamd.conf
      ansible.builtin.copy:
        src: "{{ clam_conf }}/clamd.conf"
        dest: "{{ vyos_base }}/clamav/conf/clamd.conf"
        owner: "{{ clamav_uid }}"
        group: "{{ clamav_uid }}"
        mode: "0640"
      notify: Restart clamav
      tags: [config, clamav_config]

    - name: Deploy freshclam.conf
      ansible.builtin.copy:
        src: "{{ clam_conf }}/freshclam.conf"
        dest: "{{ vyos_base }}/clamav/conf/freshclam.conf"
        owner: "{{ clamav_uid }}"
        group: "{{ clamav_uid }}"
        mode: "0640"
      notify: Restart clamav
      tags: [config, clamav_config]

    # ── Proxy transparent : squid-redirect ─────────────────────
    # L'unite vit dans /config/etc/services/ (le postconfig la lie dans /etc a
    # chaque boot). `enabled` recree les liens de [Install], dont celui de
    # vyos-container-squid.service.wants/ : squid la relance a chaque
    # demarrage. Redemarrage seulement si l'unite a change (oneshot +
    # RemainAfterExit : un ExecStart* modifie ne s'execute qu'au prochain
    # demarrage) ; il vide les regles nft du netns ~3 s, squid n'est pas touche.
    - name: squid-redirect — deposer l'unite
      ansible.builtin.copy:
        src: "{{ squid_redirect_unit }}"
        dest: /config/etc/services/squid-redirect.service
        owner: root
        group: vyattacfg
        mode: "0644"
      register: _redirect_unit
      tags: [redirect]

    - name: squid-redirect — lier dans /etc (comme le postconfig au boot)
      ansible.builtin.file:
        src: /config/etc/services/squid-redirect.service
        dest: /etc/systemd/system/squid-redirect.service
        state: link
      tags: [redirect]

    # `systemctl enable` lui-meme, pas le module systemd : celui-ci demande
    # d'abord `is-enabled`, voit « enabled » (multi-user.target) et ne relit
    # jamais [Install] -- le lien vers squid n'etait pas cree (run du
    # 2026-10-05, arrete par le controle ci-dessous). `enable` sur une unite
    # deja activee cree les liens manquants et ne la redemarre pas.
    - name: squid-redirect — recharger systemd
      ansible.builtin.systemd:
        daemon_reload: true
      tags: [redirect]

    - name: squid-redirect — activer (tous les liens de [Install])
      ansible.builtin.command:
        cmd: systemctl enable squid-redirect.service
      register: _redirect_enable
      changed_when: "'Created symlink' in _redirect_enable.stderr"
      tags: [redirect]

    - name: squid-redirect — squid la reclame bien
      ansible.builtin.command:
        cmd: systemctl show vyos-container-squid.service -p Wants --value
      register: _squid_wants
      changed_when: false
      failed_when: "'squid-redirect.service' not in _squid_wants.stdout.split()"
      check_mode: false
      tags: [redirect]

    - name: squid-redirect — redemarrer (unite modifiee)
      ansible.builtin.systemd:
        name: squid-redirect.service
        state: restarted
      when: _redirect_unit is changed
      tags: [redirect]

    # Sans elle, netavark masquerade le trafic intercepte : squid voit l'IP du
    # pont, plus celle du client (cf. commentaire de l'unite).
    - name: squid-redirect — la marque PBR ne declenche plus le masquerade
      ansible.builtin.command:
        cmd: nft list chain ip squid_tproxy postrouting
      register: _tproxy_chain
      changed_when: false
      failed_when: "'meta mark 0x7fffff9b' not in _tproxy_chain.stdout"
      check_mode: false
      when: not (ansible_check_mode and (_redirect_unit | default({})) is changed)
      tags: [redirect, check]

    # ── Postconfig : ancien bloc manuel du proxy transparent ──
    # Pose a la main en juin 2026, hors Ansible : `ip route add` dans la table
    # du PBR + une exception iptables dans NETAVARK-HOSTPORT-MASQ. Depuis
    # netavark 1.14 (pilote nftables) cette chaine n'existe plus : la commande
    # echouait au boot et le script journalisait quand meme « fixes applied ».
    # L'exception est remplacee par la table squid_tproxy (squid-redirect),
    # la route par le bloc gere ci-dessous.
    - name: Postconfig — retirer l'ancien bloc manuel du proxy transparent
      ansible.builtin.replace:
        path: /config/scripts/vyos-postconfig-bootup.script
        regexp: '(?ms)^# ── Transparent proxy PBR fixes .*?^logger -t vyos-postconfig -p user\.info "Transparent proxy PBR fixes applied[^\n]*\n\n?'
        replace: ''
        validate: sh -n %s
      tags: [redirect]

    # VyOS installe lui-meme la route statique de la table (FRR) ; on ne pose
    # celle de secours que si elle manque, et on le dit -- un correctif qui
    # tourne en silence a masque la panne du 2026-10-05.
    - name: Postconfig — route de la table du PBR controlee au boot
      ansible.builtin.blockinfile:
        path: /config/scripts/vyos-postconfig-bootup.script
        marker: "# {mark} ANSIBLE MANAGED BLOCK transparent-proxy-route"
        validate: sh -n %s
        block: |
          # ── Proxy transparent : route de la table {{ tproxy_table }} (PBR) ──
          if ip -4 route show table {{ tproxy_table }} default | grep -q .; then
              logger -t vyos-postconfig -p user.info "table {{ tproxy_table }} : route par defaut presente ($(ip -4 route show table {{ tproxy_table }} default))"
          else
              ip route add default via {{ tproxy_nexthop }} table {{ tproxy_table }} && \
                  logger -t vyos-postconfig -p user.warning "table {{ tproxy_table }} : route statique VyOS absente, route de secours posee via {{ tproxy_nexthop }}" || \
                  logger -t vyos-postconfig -p user.err "table {{ tproxy_table }} : aucune route, proxy transparent hors service"
          fi
      tags: [redirect]

    # Les certificats de squid sont sous conf/ssl_cert (cf. tache « Deploy
    # squid config directory ») : l'ancien chemin faisait crier MISSING CERT
    # a chaque boot, certificats presents.
    - name: Postconfig — chemin des certificats de squid
      ansible.builtin.replace:
        path: /config/scripts/vyos-postconfig-bootup.script
        regexp: '{{ vyos_base }}/squid/ssl_cert/'
        replace: '{{ vyos_base }}/squid/conf/ssl_cert/'
        validate: sh -n %s
      tags: [redirect, certs]

  # Restart order: clamav → c-icap → squid (dependency chain). Pas de
  # wait_for entre les restarts : les IPs de bridge podman (172.20.0.0/24)
  # ne sont pas joignables en connexion directe depuis le netns par defaut
  # de VyOS (confirme empiriquement -- Netavark ne fait que du DNAT entrant
  # sur les ports publies, rien ne route l'hote vers une IP de bridge), donc
  # un wait_for vers ces IPs ne peut structurellement jamais reussir, meme
  # quand le container est sain. Squid degrade gracieusement de toute facon
  # (icap_service ... bypass=1 dans squid.conf) si c-icap/clamav mettent du
  # temps a redemarrer -- le tag "check" en fin de run verifie le resultat
  # reel (connectivite HTTP/HTTPS) plutot que de deviner un delai.
  handlers:
    - name: Restart clamav
      ansible.builtin.command:
        cmd: /opt/vyatta/bin/vyatta-op-cmd-wrapper restart container clamav
      listen: Restart clamav
      tags: [service]

    - name: Restart c-icap
      ansible.builtin.command:
        cmd: /opt/vyatta/bin/vyatta-op-cmd-wrapper restart container c-icap
      listen: Restart c-icap
      tags: [service]

    - name: Restart squid
      ansible.builtin.command:
        cmd: /opt/vyatta/bin/vyatta-op-cmd-wrapper restart container squid
      listen: Restart squid
      tags: [service]

    - name: Wait for squid to be ready
      ansible.builtin.wait_for:
        host: "{{ inventory_hostname }}"
        port: 3128
        timeout: 60
      delegate_to: localhost
      listen: Restart squid
      tags: [service]

  post_tasks:
    - name: Flush handlers to restart containers now
      ansible.builtin.meta: flush_handlers
      tags: [check]

    - name: Test proxy connectivity (HTTP)
      ansible.builtin.command:
        cmd: >-
          curl -s -o /dev/null -w '%{http_code}'
          --proxy http://{{ ansible_host }}:3128
          --connect-timeout 10
          http://dl-cdn.alpinelinux.org/alpine/v3.20/main/x86_64/APKINDEX.tar.gz
      delegate_to: localhost
      register: _proxy_http_test
      changed_when: false
      failed_when: _proxy_http_test.stdout != '200'
      tags: [check]

    - name: Test proxy connectivity (HTTPS via CONNECT)
      ansible.builtin.command:
        cmd: >-
          curl -s -o /dev/null -w '%{http_code}'
          --proxy http://{{ ansible_host }}:3128
          --connect-timeout 10
          https://registry.npmjs.org/
      delegate_to: localhost
      register: _proxy_https_test
      changed_when: false
      failed_when: _proxy_https_test.stdout != '200'
      tags: [check]

    - name: Display results
      ansible.builtin.debug:
        msg:
          - "HTTP  proxy test → {{ _proxy_http_test.stdout }}"
          - "HTTPS proxy test → {{ _proxy_https_test.stdout }}"
      tags: [check]
