# ansible-playbook suricata-deploy.yaml -i <ton-inventaire>
#
# Déploie la configuration Suricata (IPS NFQUEUE) sur le container Podman
# de VyOS, ainsi que le script de mise à jour des règles (task-scheduler).
#
# Les fichiers source sont dans etc/suricata/ (versionnés dans git). Ce
# repo ne fournit pas d'inventaire -- vois le README pour cibler le groupe
# Ansible "vyos" depuis ton propre inventaire (usage standalone ou en
# submodule Git).
#
# Le fichier suricata.rules (téléchargé quotidiennement par suricata-update)
# n'est PAS géré ici -- c'est un artefact généré, pas une source de vérité.
#
# Container et IP (réseau podman, mode NFQUEUE host networking) :
#   suricata → allow-host-networks, pas d'IP dediee (NFQUEUE exige le netns hote)
#
# Tags disponibles :
#   config   → copier les fichiers de conf + local.rules
#   script   → copier le script de mise à jour des règles (task-scheduler)
#   service  → redémarrer le container suricata
#   check    → vérifier que le container tourne
#   logrotate → rotation des journaux (remplace celle du paquet de l'image
#               VyOS, cassee en conteneur), conservee dans /config et
#               reinstallee a chaque boot
#   rsyslog  → transmission d'eve.json et fast.log au syslog (donc au collecteur
#               distant), conservee dans /config et reinstallee a chaque boot
#
# Exemples :
#   ansible-playbook suricata-deploy.yaml
#   ansible-playbook suricata-deploy.yaml --tags config
#   ansible-playbook suricata-deploy.yaml --tags script
#   ansible-playbook suricata-deploy.yaml --tags check
#   ansible-playbook suricata-deploy.yaml --check --diff --tags config

- name: Deploy Suricata config to VyOS container
  hosts: vyos
  gather_facts: false
  vars:
    vyos_base: /config/containers/suricata
    script_dest: /config/scripts/suricata-update.sh

  pre_tasks:
    # Garde-fou de version : echoue si le routeur fait tourner une image
    # differente de celle que l'inventaire declare. Lecture seule, sans
    # effet si `vyos_container_images` n'est pas defini. Voir
    # tasks/check-container-images.yml pour le pourquoi.
    - name: Check the running container images against the inventory
      ansible.builtin.include_tasks: tasks/check-container-images.yml
      vars:
        _checked_containers: ["suricata"]
      tags: always

    # suricata_conf n'est PAS mis dans vars: ci-dessus : les vars de play ont
    # une priorite plus haute que les group_vars/host_vars d'inventaire, ce
    # qui empecherait un inventaire de fournir sa propre valeur. Le default()
    # ci-dessous ne s'applique que si rien (inventaire ni -e) ne le fournit.
    - name: Resolve suricata_conf (inventory override wins over bundled example)
      ansible.builtin.set_fact:
        suricata_conf: "{{ suricata_conf | default(playbook_dir + '/etc/suricata') }}"
      delegate_to: localhost
      tags: always

    - name: Check source directory exists
      ansible.builtin.stat:
        path: "{{ suricata_conf }}/suricata.yaml"
      delegate_to: localhost
      register: _suricata_conf_check
      tags: [suricata_deploy, config, script, service, check]

    - name: Fail if source directory missing
      ansible.builtin.fail:
        msg: "{{ suricata_conf }}/suricata.yaml not found."
      when: not _suricata_conf_check.stat.exists
      tags: [suricata_deploy, config, script, service, check]

  tasks:
    # ── Config files (etc/) ──────────────────────────────────────
    # Pas de delegate_to/become explicite : ansible_become: true (host_vars)
    # s'applique par defaut, et owner/group/mode directement sur copy
    # remplacent les anciennes taches "Fix ... ownership/permissions"
    # separees -- --check/--diff fonctionnent aussi nativement.
    - name: Deploy etc/ config files
      ansible.builtin.copy:
        src: "{{ suricata_conf }}/{{ item }}"
        dest: "{{ vyos_base }}/etc/{{ item }}"
        mode: "0644"
      loop:
        - suricata.yaml
        - disable.conf
        - modify.conf
        - classification.config
        - reference.config
        - threshold.config
        - update.yaml
        - suricata.start
      notify: Restart suricata
      tags: [config]

    # ── Custom rules ───────────────────────────────────────────────
    - name: Deploy local.rules
      ansible.builtin.copy:
        src: "{{ suricata_conf }}/rules/local.rules"
        dest: "{{ vyos_base }}/rules/local.rules"
        owner: "8000"
        group: "8000"
      notify: Restart suricata
      tags: [config]

    # ── Update script (VyOS task-scheduler, daily rule refresh) ────
    - name: Deploy suricata-update.sh
      ansible.builtin.copy:
        src: "{{ suricata_conf }}/suricata-update.sh"
        dest: "{{ script_dest }}"
        owner: radius_user
        group: vyattacfg
        mode: "0775"
      tags: [script]

    # ── Rotation des journaux ──────────────────────────────────────
    # La configuration du paquet Debian (dans l'image VyOS) a un postrotate
    # qui signale le pid HOTE de Suricata, absent puisqu'il tourne en
    # conteneur : logrotate echoue avant de compresser, et chaque semaine un
    # `.1-<date>.backup` s'ajoute sans jamais etre purge. Celle-ci la
    # remplace. /etc appartient a l'image systeme : la copie dans /config est
    # reinstallee a chaque boot par le script de post-configuration.
    - name: logrotate — source presente ?
      ansible.builtin.stat:
        path: "{{ suricata_conf }}/logrotate"
      delegate_to: localhost
      become: false
      register: _logrotate_src
      tags: [logrotate]

    - name: logrotate — conserver dans /config
      ansible.builtin.copy:
        src: "{{ suricata_conf }}/logrotate"
        dest: /config/etc/logrotate/suricata
        owner: root
        group: root
        mode: "0644"
      when: _logrotate_src.stat.exists
      tags: [logrotate]

    - name: logrotate — installer (remplace celle du paquet)
      ansible.builtin.copy:
        src: "{{ suricata_conf }}/logrotate"
        dest: /etc/logrotate.d/suricata
        owner: root
        group: root
        mode: "0644"
      when: _logrotate_src.stat.exists
      tags: [logrotate]

    - name: logrotate — reinstaller a chaque boot
      ansible.builtin.blockinfile:
        path: /config/scripts/vyos-postconfig-bootup.script
        marker: "# {mark} suricata logrotate (vyos-deploy)"
        block: |
          [ -f /config/etc/logrotate/suricata ] && \
            install -m 0644 -o root -g root /config/etc/logrotate/suricata /etc/logrotate.d/suricata
      when: _logrotate_src.stat.exists
      tags: [logrotate]

    # `logrotate -d` simule sans rien toucher ; une erreur de syntaxe ou un
    # fichier ignore (mauvais proprietaire/mode) sort sur stderr.
    - name: logrotate — valider
      ansible.builtin.command:
        cmd: logrotate -d /etc/logrotate.d/suricata
      register: _logrotate_debug
      changed_when: false
      failed_when: _logrotate_debug.rc != 0 or ('error' in (_logrotate_debug.stderr | lower))
      when: _logrotate_src.stat.exists
      tags: [logrotate]

    # ── Transmission des journaux (rsyslog) ────────────────────────
    # Le fichier vivait seulement dans /etc : une montee d'image VyOS le
    # perdait, et plus aucun evenement Suricata n'aurait quitte le routeur,
    # sans erreur. Meme schema que logrotate : /etc + copie dans /config
    # reinstallee au boot (puis rsyslog relance, il est deja demarre).
    - name: rsyslog — source presente ?
      ansible.builtin.stat:
        path: "{{ suricata_conf }}/rsyslog.conf"
      delegate_to: localhost
      become: false
      register: _rsyslog_src
      tags: [rsyslog]

    - name: rsyslog — conserver dans /config
      ansible.builtin.copy:
        src: "{{ suricata_conf }}/rsyslog.conf"
        dest: /config/etc/rsyslog/10-suricata.conf
        owner: root
        group: root
        mode: "0644"
      when: _rsyslog_src.stat.exists
      tags: [rsyslog]

    - name: rsyslog — installer
      ansible.builtin.copy:
        src: "{{ suricata_conf }}/rsyslog.conf"
        dest: /etc/rsyslog.d/10-suricata.conf
        owner: root
        group: root
        mode: "0644"
      when: _rsyslog_src.stat.exists
      notify: Restart rsyslog
      tags: [rsyslog]

    - name: rsyslog — reinstaller a chaque boot
      ansible.builtin.blockinfile:
        path: /config/scripts/vyos-postconfig-bootup.script
        marker: "# {mark} suricata rsyslog (vyos-deploy)"
        block: |
          if [ -f /config/etc/rsyslog/10-suricata.conf ]; then
            install -m 0644 -o root -g root /config/etc/rsyslog/10-suricata.conf /etc/rsyslog.d/10-suricata.conf
            systemctl restart rsyslog
          fi
      when: _rsyslog_src.stat.exists
      tags: [rsyslog]

  handlers:
    - name: Restart rsyslog
      ansible.builtin.systemd:
        name: rsyslog
        state: restarted
      listen: Restart rsyslog

    - name: Restart suricata
      ansible.builtin.command:
        cmd: /opt/vyatta/bin/vyatta-op-cmd-wrapper restart container suricata
      listen: Restart suricata
      tags: [service]

    - name: Wait for suricata to be ready
      # FROM scratch = no shell/podman exec possible. NFQUEUE host-networking
      # exposes no dedicated port to wait_for either -- use VyOS's own
      # "show container" op-command (same wrapper as the restart above,
      # no nested ssh call, no remote quoting to get wrong).
      ansible.builtin.command:
        cmd: /opt/vyatta/bin/vyatta-op-cmd-wrapper show container
      register: _suricata_running
      retries: 6
      delay: 5
      until: "'suricata' in _suricata_running.stdout and 'Up' in _suricata_running.stdout"
      changed_when: false
      failed_when: false
      listen: Restart suricata
      tags: [service]

  post_tasks:
    - name: Flush handlers to restart container now
      ansible.builtin.meta: flush_handlers
      tags: [check]

    - name: Check suricata container is running
      ansible.builtin.command:
        cmd: /opt/vyatta/bin/vyatta-op-cmd-wrapper show container
      register: _suricata_status
      changed_when: false
      failed_when: false
      tags: [check]

    - name: Display result
      ansible.builtin.debug:
        msg: "{{ _suricata_status.stdout_lines | select('search', 'suricata') | list }}"
      tags: [check]

    - name: Fail if suricata isn't up
      ansible.builtin.fail:
        msg: "suricata container not found running: {{ _suricata_status.stdout }}"
      when: "'suricata' not in _suricata_status.stdout or 'Up' not in (_suricata_status.stdout_lines | select('search', 'suricata') | first | default(''))"
      tags: [check]
